<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MAMMEDOV & CO. — Growth House, Dubai</title>
<meta name="description" content="MAMMEDOV & CO. — growth house for premium businesses in Dubai: strategy, targeted advertising, SMM, AI production, websites and sales in Direct.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#2B3527">
<meta property="og:type" content="website">
<meta property="og:site_name" content="MAMMEDOV & CO.">
<meta property="og:title" content="MAMMEDOV & CO. — Growth House, Dubai">
<meta property="og:description" content="From one second on a phone to revenue: ads, Direct sales, SMM, AI production and websites for premium businesses in Dubai. Free audit in 12 hours.">
<meta property="og:url" content="https://mammedov.pages.dev/">
<meta property="og:image" content="https://mammedov.pages.dev/og.jpg">
<meta property="og:image:width" content="1200"><meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<link rel="canonical" href="https://mammedov.pages.dev/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Manrope:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#F4F1EB; --stone:#E9E3D9; --card:#FBF9F5;
  --olive:#2B3527; --olive-2:#3B4835; --sage:#9DAA93; --sage-l:#D3DACB;
  --rose:#A9786A; --rose-l:#EBD5CC;
  --ink:#1C1B18; --muted:#4F4C46; --line:rgba(28,27,24,.12); --line-d:rgba(244,241,235,.16);
  --serif:"Cormorant Garamond",Georgia,serif; --sans:"Manrope",system-ui,sans-serif;
  --pad:clamp(20px,5vw,72px); --max:1280px; --ease:cubic-bezier(.22,.7,.1,1);
  --navh:72px;
}
html[lang="ar"]{--serif:"Noto Naskh Arabic",serif;--sans:"IBM Plex Sans Arabic",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}

/* ===== PAGE-BY-PAGE SNAP ===== */
html{scroll-snap-type:y mandatory;scroll-behavior:smooth;overscroll-behavior-y:none}
.screen{min-height:100vh;min-height:100svh;scroll-snap-align:start;scroll-snap-stop:always;display:flex;flex-direction:column;justify-content:center;padding:calc(var(--navh) + 2vh) 0 4vh;position:relative}
.screen.end{scroll-snap-align:end;min-height:auto}

body{background:var(--ivory);color:var(--ink);font-family:var(--sans);font-size:clamp(15px,min(1.15vw,2vh),17px);line-height:1.62;-webkit-font-smoothing:antialiased;overflow-x:hidden}
html[lang="ar"] body{font-size:clamp(16px,min(1.2vw,2.1vh),18px);line-height:1.8}
img,video{display:block;max-width:100%}
a{color:inherit}
::selection{background:var(--olive);color:var(--ivory)}
.wrap{width:100%;max-width:var(--max);margin:0 auto;padding-inline:var(--pad)}
.eyebrow{font-size:12px;letter-spacing:.18em;text-transform:uppercase;font-weight:700;color:var(--rose)}
html[lang="ar"] .eyebrow{letter-spacing:0;font-size:13.5px}
h1,h2,h3{font-family:var(--serif);font-weight:600;line-height:1.08}
html[lang="ar"] h1,html[lang="ar"] h2,html[lang="ar"] h3{line-height:1.45;font-weight:700}
h2{font-size:clamp(28px,min(3.6vw,6vh),56px);margin-top:10px;max-width:22ch}
html[lang="ar"] h2{font-size:clamp(24px,min(2.8vw,4.8vh),42px)}
h2 em,h1 em{font-style:italic;color:var(--rose)}
html[lang="ar"] em{font-style:normal}
.lead{font-size:clamp(15px,min(1.25vw,2.2vh),18px);color:var(--muted);max-width:60ch;margin-top:14px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.dark{background:var(--olive);color:var(--ivory)}
.dark .lead{color:rgba(244,241,235,.82)}
.dark h2 em{color:var(--rose-l)}
.dark .eyebrow{color:var(--rose-l)}
.stone{background:var(--stone)}
.mt{margin-top:clamp(18px,3.4vh,40px)}

/* NAV */
.nav{position:fixed;inset-inline:0;top:0;z-index:90;height:var(--navh);display:flex;justify-content:space-between;align-items:center;padding:0 var(--pad);color:var(--ivory);transition:background .4s,color .4s}
.nav.solid{background:rgba(244,241,235,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--ink);border-bottom:1px solid var(--line)}
.logo{text-decoration:none;font-family:"Cormorant Garamond",serif;font-weight:600;font-size:21px;letter-spacing:.22em;white-space:nowrap}
.logo i{font-style:italic;letter-spacing:0;margin:0 .18em}
.nav-r{display:flex;gap:14px;align-items:center}
.langs{display:flex;border:1px solid currentColor;border-radius:99px;padding:3px}
.langs button{all:unset;cursor:pointer;font:700 12px "Manrope","IBM Plex Sans Arabic",sans-serif;padding:6px 11px;border-radius:99px}
.langs button[aria-pressed="true"]{background:var(--ivory);color:var(--ink)}
.nav.solid .langs button[aria-pressed="true"]{background:var(--ink);color:var(--ivory)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font:700 15px var(--sans);text-decoration:none;padding:15px 26px;border-radius:99px;border:1.5px solid currentColor;background:none;color:inherit;cursor:pointer;transition:background .3s,color .3s,border-color .3s}
html[dir="rtl"] .btn .ar{transform:scaleX(-1)}
.btn.light{background:var(--ivory);color:var(--ink);border-color:var(--ivory)}
.btn.light:hover{background:var(--rose-l);border-color:var(--rose-l)}
.btn.dark{background:var(--olive);color:var(--ivory);border-color:var(--olive)}
.btn.dark:hover{background:var(--ink);border-color:var(--ink)}
.nav .btn{padding:10px 18px;font-size:13.5px}

/* DOTS */
.dots{position:fixed;z-index:85;inset-inline-end:22px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:12px}
.dots button{all:unset;cursor:pointer;width:8px;height:8px;border-radius:50%;background:var(--sage);opacity:.55;transition:all .35s var(--ease)}
.dots button.on{background:var(--rose);opacity:1;height:24px;border-radius:6px}

/* RAILS (grid on desktop, swipe on mobile) */
.rail{display:grid;gap:16px}
.rail.c4{grid-template-columns:repeat(4,1fr)}
.rail.c3{grid-template-columns:repeat(3,1fr)}
.rail.swipe{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 32px)/3);grid-template-columns:none;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding-bottom:4px}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}
.rail-ctl{display:flex;gap:8px}
.rail-ctl button{all:unset;cursor:pointer;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-size:18px;transition:background .3s}
.rail-ctl button:hover{background:var(--card)}
html[dir="rtl"] .rail-ctl button{transform:scaleX(-1)}
.swipe-hint{display:none;font-size:13px;color:var(--muted);margin-top:10px}

/* HERO */
.hero{padding:0;justify-content:stretch;background:var(--olive);color:var(--ivory)}
.hero-grid{flex:1;display:grid;grid-template-columns:minmax(0,46fr) minmax(0,54fr)}
.hero-text{display:flex;flex-direction:column;justify-content:center;padding:calc(var(--navh) + 3vh) var(--pad) 4vh}
.hero .eyebrow{color:var(--rose-l);margin-bottom:2.4vh}
.hero h1{font-size:clamp(34px,min(4vw,7.4vh),66px);max-width:15ch}
html[lang="ru"] .hero h1{font-size:clamp(30px,min(3.5vw,6.6vh),58px)}
html[lang="ar"] .hero h1{font-size:clamp(28px,min(3.2vw,6vh),54px)}
.hero h1 em{color:var(--rose-l)}
.hero-sub{margin-top:2.6vh;max-width:46ch;font-size:clamp(15px,min(1.2vw,2.2vh),18.5px);color:rgba(244,241,235,.88)}
.hero-ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:3.6vh}
.hero-media{position:relative;overflow:hidden}
.hero-media video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:42% 50%}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--olive) 0%,rgba(43,53,39,0) 22%)}
html[dir="rtl"] .hero-media::after{background:linear-gradient(270deg,var(--olive) 0%,rgba(43,53,39,0) 22%)}
.hero-cap{position:absolute;z-index:2;bottom:20px;inset-inline-end:56px;font-size:13px;color:rgba(244,241,235,.88);text-align:end;text-shadow:0 1px 10px rgba(0,0,0,.5)}
.hero-cap b{display:block;font-family:var(--serif);font-style:italic;font-weight:500;font-size:19px}
.strip{background:var(--olive-2);color:rgba(244,241,235,.92);font-size:13.5px;font-weight:600}
.strip .wrap{display:flex;gap:8px 30px;flex-wrap:wrap;justify-content:space-between;padding-block:14px}
.strip span::before{content:"✦";color:var(--rose-l);margin-inline-end:9px;font-size:9px;vertical-align:middle}

/* CARDS */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:clamp(18px,2.6vh,28px)}
.pain .q{font-family:var(--serif);font-size:40px;line-height:.6;color:var(--rose)}
.pain h3{font-size:clamp(20px,min(1.7vw,3vh),24px);margin:12px 0 6px}
.pain p{color:var(--muted);font-size:15px}

.svc{display:flex;flex-direction:column}
.svc .n{font-family:"Cormorant Garamond",serif;font-size:24px;color:var(--rose);font-weight:600}
.svc h3{font-size:clamp(24px,min(2vw,3.6vh),30px);margin:2px 0 6px}
html[lang="ar"] .svc h3{font-size:clamp(20px,min(1.6vw,3vh),24px)}
.svc>p{color:var(--muted);font-size:14.5px}
.svc ul{list-style:none;margin:12px 0;display:flex;flex-direction:column;gap:6px}
.svc li{display:flex;gap:9px;font-size:14.5px;line-height:1.45}
.svc li::before{content:"";flex:0 0 6px;height:6px;border-radius:50%;background:var(--sage);margin-top:8px}
.svc .proof{display:inline-block;font-size:12px;font-weight:700;color:var(--olive);background:var(--sage-l);padding:5px 11px;border-radius:99px;align-self:flex-start;margin-bottom:10px}
.svc .res{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;font-size:14px;font-weight:700;color:var(--olive-2)}

.rd{border-top:1px solid var(--line-d);padding-top:2.6vh}
.rd .d{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rose-l)}
html[lang="ar"] .rd .d{letter-spacing:0}
.rd h3{font-size:clamp(22px,min(2vw,3.6vh),28px);margin:8px 0 8px}
.rd p{color:rgba(244,241,235,.84);font-size:15px}

.roi{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,80px);align-items:center}
.cr{margin-bottom:2.2vh}
.cr .top{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:15px;margin-bottom:4px}
.cr .top output{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--olive);line-height:1}
input[type=range]{width:100%;accent-color:var(--olive);height:26px;cursor:pointer}
.calc-out{border-top:1px solid var(--line);padding-top:2vh;display:grid;grid-template-columns:1fr 1fr;gap:16px}
.calc-out span{display:block;font-size:13px;color:var(--muted);font-weight:600}
.calc-out b{font-family:"Cormorant Garamond",serif;font-size:clamp(30px,min(3vw,5.4vh),44px);font-weight:600;color:var(--olive);line-height:1.15}
.calc-out .x b{color:var(--rose)}
.note{font-size:12.5px;color:var(--muted);margin-top:10px}

.ind .ph{aspect-ratio:1/1;overflow:hidden;border-radius:12px}
.ind .ph img{width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease)}
.ind:hover .ph img{transform:scale(1.05)}
.ind .tag{display:block;margin-top:14px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rose)}
html[lang="ar"] .ind .tag{letter-spacing:0;font-size:13.5px}
.ind h3{font-size:clamp(20px,min(1.7vw,3vh),24px);margin:4px 0 4px}
.ind p{color:var(--muted);font-size:14.5px}

.case-top{display:grid;grid-template-columns:1.2fr 1fr;gap:50px;align-items:end}
.conf{display:flex;gap:10px;align-items:center;font-size:13px;color:rgba(244,241,235,.7);margin-top:12px}
.conf::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--rose-l);flex:none}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line-d)}
.stat{padding:2.6vh 18px 0 0}
html[dir="rtl"] .stat{padding:2.6vh 0 0 18px}
.stat .pre{font-size:13px;font-weight:600;color:rgba(244,241,235,.65);height:20px}
.stat .big{font-family:"Cormorant Garamond",serif;font-weight:500;font-size:clamp(52px,min(6.4vw,12vh),104px);line-height:1;margin:6px 0 8px}
.stat .big small{font:600 .24em var(--sans);color:var(--rose-l);margin-inline-start:6px}
.stat p{font-size:14.5px;color:rgba(244,241,235,.86);max-width:24ch}
.case-b{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(24px,4vw,60px);align-items:center}
.case-b .ph{height:min(66vh,560px);overflow:hidden;border-radius:12px}
.case-b .ph img{width:100%;height:100%;object-fit:cover}
.wk{border-top:1px solid var(--line-d);padding:2vh 0}
.wk .w{font-size:12.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--rose-l)}
html[lang="ar"] .wk .w{letter-spacing:0}
.wk h3{font-size:clamp(22px,min(1.9vw,3.4vh),27px);margin:4px 0 4px}
.wk p{color:rgba(244,241,235,.86);font-size:15px}

.cmp{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.cmp table{width:100%;border-collapse:collapse;min-width:560px}
.cmp th,.cmp td{padding:min(1.6vh,14px) 16px;text-align:start;border-bottom:1px solid var(--line);font-size:15px}
.cmp th{font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
html[lang="ar"] .cmp th{letter-spacing:0;font-size:13.5px}
.cmp tr:last-child td{border-bottom:none}
.cmp td:not(:first-child),.cmp th:not(:first-child){text-align:center;width:18%}
.cmp .us{background:var(--sage-l);color:var(--olive);font-weight:700}
.y{color:var(--olive);font-weight:700}.n{color:#A9A296}.p{color:var(--rose)}

.fgrid{display:grid;grid-template-columns:5fr 6fr;gap:clamp(36px,6vw,100px);align-items:center}
.fphoto{height:min(72vh,620px);overflow:hidden;border-radius:14px}
.fphoto img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.quote{font-family:var(--serif);font-size:clamp(24px,min(2.6vw,4.6vh),40px);line-height:1.25;font-weight:600;margin-top:12px}
html[lang="ar"] .quote{line-height:1.7;font-size:clamp(21px,min(2vw,3.6vh),30px)}
.fname{margin-top:2.6vh}
.fname b{display:block;font-family:"Cormorant Garamond",serif;font-size:25px;font-weight:600}
.fname span{color:var(--muted);font-size:14.5px}
.team{display:flex;flex-wrap:wrap;gap:8px;margin-top:2.4vh}
.team span{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:6px 14px;font-size:13.5px;font-weight:600;color:var(--olive-2)}

.pkg{display:flex;flex-direction:column;position:relative}
.pkg.hi{background:var(--olive);color:var(--ivory);border-color:var(--olive)}
.pkg .badge{position:absolute;top:-12px;inset-inline-start:24px;background:var(--rose);color:#fff;font-size:12px;font-weight:700;padding:4px 12px;border-radius:99px}
.pkg h3{font-size:clamp(24px,min(2vw,3.8vh),30px)}
.pkg .for{font-size:14px;color:var(--muted);margin-top:4px}
.pkg.hi .for{color:rgba(244,241,235,.8)}
.pkg .pr{font-family:"Cormorant Garamond",serif;font-size:clamp(34px,min(3.2vw,6vh),46px);font-weight:600;margin:1.6vh 0 0;line-height:1}
.pkg .pr small,.pkg .pr span{font:600 13.5px var(--sans);opacity:.75;margin-inline:4px}
.pkg ul{list-style:none;margin:2vh 0 2.4vh;display:flex;flex-direction:column;gap:8px}
.pkg li{display:flex;gap:9px;font-size:14.5px;line-height:1.45}
.pkg li::before{content:"✓";color:var(--rose);font-weight:700}
.pkg.hi li::before{color:var(--rose-l)}
.pkg .btn{margin-top:auto;padding:13px 20px}
.pk-note{font-size:13px;color:var(--muted);margin-top:14px}

.faq{border-top:1px solid var(--line);max-width:900px}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:20px;padding:min(2.4vh,20px) 0;font-size:clamp(16px,min(1.4vw,2.6vh),19px);font-weight:700}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font-size:24px;line-height:1;color:var(--rose);transition:transform .3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{color:var(--muted);padding-bottom:2vh;max-width:70ch}

.agrid{display:grid;grid-template-columns:5fr 6fr;gap:clamp(36px,6vw,100px);align-items:center}
.gets{list-style:none;margin-top:2.6vh}
.gets li{display:flex;gap:12px;padding:1.4vh 0;border-bottom:1px solid var(--line-d);color:rgba(244,241,235,.92)}
.gets li::before{content:"✓";color:var(--rose-l);font-weight:700}
form{display:grid;grid-template-columns:1fr 1fr;gap:min(2.2vh,20px) 18px;align-content:start;background:rgba(244,241,235,.05);border:1px solid var(--line-d);border-radius:16px;padding:clamp(18px,3vh,32px)}
.f{display:flex;flex-direction:column;gap:5px}.f.full{grid-column:1/-1}
label{font-size:13px;font-weight:700;color:rgba(244,241,235,.78)}
input:not([type=range]),select,textarea{font:inherit;font-size:16px;color:var(--ivory);background:rgba(244,241,235,.07);border:1px solid rgba(244,241,235,.22);border-radius:10px;padding:min(1.4vh,12px) 14px;outline:none;-webkit-appearance:none;appearance:none;width:100%}
input:not([type=range]):focus,select:focus,textarea:focus{border-color:var(--rose-l)}
select option{color:var(--ink)}
textarea{min-height:min(9vh,80px);resize:vertical}
.ffoot{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap}
.ffoot small{color:rgba(244,241,235,.65);font-size:12.5px;max-width:32ch}
.err{grid-column:1/-1;color:var(--rose-l);font-size:14px}
.err:empty{display:none}
.sent{display:none;grid-column:1/-1;border-top:1px solid var(--line-d);padding-top:16px}
.sent.show{display:block}
.sent h3{font-size:26px;margin-bottom:4px}
.sent pre{white-space:pre-wrap;font:14px var(--sans);color:rgba(244,241,235,.9);background:rgba(0,0,0,.18);padding:12px;border-radius:10px;margin:12px 0;max-height:22vh;overflow:auto}
.sent .row{display:flex;gap:10px;flex-wrap:wrap}

footer{background:#232C20;color:rgba(244,241,235,.75);padding:44px 0 34px;font-size:14.5px}
.fbig{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:clamp(38px,8vw,120px);letter-spacing:.06em;color:var(--ivory);line-height:1;white-space:nowrap}
.fbig i{letter-spacing:0;color:var(--rose-l)}
.frow{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-top:24px}
.frow a{color:var(--ivory);text-decoration:none;font-weight:700}

/* reveal */
.rv{opacity:0;transform:translateY(20px);transition:opacity .8s var(--ease),transform .8s var(--ease)}
.rv.in{opacity:1;transform:none}
.no-io .rv{opacity:1;transform:none}

/* ===== TABLET / MOBILE ===== */

.flow{--ivory:#F4F1EB;--olive:#2B3527;--olive-2:#3B4835;--sage:#9DAA93;--sage-l:#D3DACB;--rose:#A9786A;--rose-l:#EBD5CC;
  position:relative;width:100%;height:100%;background:radial-gradient(120% 90% at 50% 0%,#34412F 0%,#2B3527 55%,#242D21 100%);color:var(--ivory);overflow:hidden;
  font-family:"Manrope","IBM Plex Sans Arabic",system-ui,sans-serif;display:flex;flex-direction:column;container-type:size}
.flow .ft{padding:5cqh 6cqw 0;display:flex;justify-content:space-between;align-items:flex-start;gap:4cqw}
.flow .ft h3{margin:0;font-family:"Cormorant Garamond","Noto Naskh Arabic",serif;font-weight:600;font-size:min(4.4cqw,7cqh);line-height:1.08;max-width:22ch}
.flow .ft h3 em{font-style:italic;color:var(--rose-l)}
.flow .brand{font-family:"Cormorant Garamond",serif;font-weight:600;letter-spacing:.2em;font-size:min(1.4cqw,2.4cqh);opacity:.8;white-space:nowrap}
.flow .brand i{letter-spacing:0;color:var(--rose-l)}
.flow .track{position:relative;flex:1;display:grid;grid-template-columns:repeat(4,1fr);align-content:center;gap:2.4cqw;padding:2cqh 6cqw 2cqh}
.flow .line{position:absolute;left:calc(6cqw + 12.5% - 3cqw);right:calc(6cqw + 12.5% - 3cqw);top:calc(4cqh + 9cqh);height:2px;background:rgba(244,241,235,.14)}

.flow .dot{position:absolute;top:calc(4cqh + 9cqh);width:16px;height:16px;margin:-7px 0 0 -8px;border-radius:50%;background:var(--rose-l);box-shadow:0 0 0 6px rgba(235,213,204,.18),0 0 24px rgba(235,213,204,.6);left:0;opacity:0}
.flow .node{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;opacity:.28;transition:none}
.flow .ico{width:18cqh;height:18cqh;max-width:15cqw;max-height:15cqw;border-radius:50%;background:var(--olive-2);border:1.5px solid rgba(244,241,235,.2);display:grid;place-items:center;position:relative;z-index:1}
.flow .ico svg{width:58%;height:58%;overflow:visible}
.flow .k{margin-top:3cqh;font-size:min(1.1cqw,1.9cqh);letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:var(--rose-l)}
.flow .big{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:min(5.6cqw,10cqh);line-height:1;margin-top:1.4cqh;font-variant-numeric:lining-nums;white-space:nowrap}
.flow .big small{font-family:"Manrope",sans-serif;font-size:.3em;font-weight:600;margin-inline-start:.3em;color:var(--rose-l)}
.flow .lbl{margin-top:1.2cqh;font-size:min(1.3cqw,2.3cqh);color:rgba(244,241,235,.82);max-width:22ch;line-height:1.4}
.flow .fn{padding:0 6cqw 4cqh;font-size:min(1cqw,1.8cqh);color:rgba(244,241,235,.55);display:flex;justify-content:space-between;gap:20px}
/* chat bubbles / calendar / bars inside icons via svg */
.flow .b{fill:var(--ivory)}
.flow .b2{fill:var(--rose-l)}
.flow .cal rect{fill:rgba(244,241,235,.16)}
.flow .cal rect.on{fill:var(--sage-l)}
.flow .bar{fill:var(--rose-l)}
/* vertical layout (portrait) */
@container (max-aspect-ratio: 1/1){
  .flow .ft{flex-direction:column;padding:6cqh 8cqw 0;gap:1.4cqh}
  .flow .ft h3{font-size:8.4cqw;max-width:none}
  .flow .brand{font-size:3.2cqw;order:-1}
  .flow .track{grid-template-columns:1fr;grid-template-rows:repeat(4,1fr);gap:0;padding:3cqh 8cqw 2cqh}
  .flow .line{left:calc(8cqw + 8.5cqw);right:auto;top:calc(3cqh + 7cqh);bottom:calc(2cqh + 12.5% - 2cqh);width:2px;height:auto}
  .flow .line i{transform-origin:top;transform:scaleY(0)}
  .flow .dot{left:calc(8cqw + 8.5cqw);top:0;margin:-8px 0 0 -7px}
  .flow .node{flex-direction:row;align-items:center;text-align:start;gap:5cqw}
  .flow .ico{width:17cqw;height:17cqw;max-width:none;max-height:none;flex:none}
  .flow .node .tx{display:flex;flex-direction:column}
  .flow .k{margin-top:0;font-size:2.8cqw}
  .flow .big{font-size:11cqw;margin-top:.6cqh}
  .flow .lbl{font-size:3.4cqw;margin-top:.4cqh;max-width:none}
  .flow .fn{padding:0 8cqw 4cqh;font-size:2.6cqw;flex-direction:column;gap:4px}
}
.flow[dir="rtl"] .k{letter-spacing:0}

/* ===== HERO PHONE SCENARIO ===== */
.hero-media video{filter:brightness(.42) saturate(.8)}
.ph-wrap{position:absolute;inset:0;z-index:2;display:grid;place-items:center}
.phone{--h:min(76vh,640px);height:var(--h);width:calc(var(--h)*.49);border-radius:calc(var(--h)*.075);background:#0d0d0c;padding:calc(var(--h)*.016);box-shadow:0 40px 80px rgba(0,0,0,.45),0 0 0 1.5px rgba(244,241,235,.18) inset;position:relative}
.phone::before{content:"";position:absolute;top:calc(var(--h)*.028);left:50%;width:28%;height:calc(var(--h)*.03);border-radius:99px;background:#0d0d0c;transform:translateX(-50%);z-index:5}
.scr{position:relative;width:100%;height:100%;border-radius:calc(var(--h)*.062);overflow:hidden;background:#F4F1EB;font-family:"Manrope","IBM Plex Sans Arabic",sans-serif;font-size:calc(var(--h)*.0215);color:#1C1B18}
.reel{position:absolute;inset:0;background:#111;z-index:0}
.reel img{width:100%;height:100%;object-fit:cover}
.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 45%,rgba(0,0,0,.78) 100%)}
.r-top{position:absolute;top:9%;inset-inline-start:6%;z-index:2;color:#fff;font-size:.82em;font-weight:600;opacity:.85}
.r-bot{position:absolute;inset-inline:6%;bottom:5%;z-index:2;color:#fff}
.r-acc{display:flex;align-items:center;gap:.5em;font-size:.95em}
.r-acc i,.c-head i{width:2em;height:2em;border-radius:50%;background:linear-gradient(135deg,#EBD5CC,#A9786A);flex:none;border:2px solid #fff}
.r-bot p{margin:.5em 0 .6em;font-size:.95em;line-height:1.35;opacity:.95}
.r-price{display:inline-block;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:.25em .8em;font-weight:700;font-size:.9em;margin-bottom:.7em}
.r-cta{display:flex;justify-content:space-between;align-items:center;background:#fff;color:#1C1B18;border-radius:.6em;padding:.75em .9em;font-weight:700}
.tap{position:absolute;z-index:3;width:3.2em;height:3.2em;border-radius:50%;background:rgba(255,255,255,.55);box-shadow:0 0 0 0 rgba(255,255,255,.5);bottom:6.2%;left:50%;margin-left:-1.6em;opacity:0;pointer-events:none}
.chat{position:absolute;inset:0;z-index:3;background:#F4F1EB;display:flex;flex-direction:column;transform:translateY(100%)}
.c-head{display:flex;align-items:center;gap:.6em;padding:3.2em .9em .7em;border-bottom:1px solid rgba(0,0,0,.08);background:#FBF9F5}
.c-head .back{font-size:1.6em;line-height:1;color:#555}
.c-head b{display:block;font-size:.95em}.c-head small{font-size:.75em;color:#3B4835}
.c-body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;gap:.55em;padding:.9em;overflow:hidden}
.m{max-width:82%;padding:.65em .85em;border-radius:1.1em;line-height:1.38;font-size:.92em;display:none}
.m.me{align-self:flex-end;background:#3B4835;color:#F4F1EB;border-end-end-radius:.3em}
.m.them{align-self:flex-start;background:#fff;border:1px solid rgba(0,0,0,.07);border-end-start-radius:.3em}
.m.ok{background:#D3DACB;border-color:transparent;font-weight:700}
.m.typing{padding:.75em .9em}.m.typing span{display:inline-block;width:.42em;height:.42em;margin:0 .1em;border-radius:50%;background:#9DAA93;animation:tdot 1s infinite}
.m.typing span:nth-child(2){animation-delay:.15s}.m.typing span:nth-child(3){animation-delay:.3s}
@keyframes tdot{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-.3em);opacity:1}}
.c-in{margin:.6em .9em 1.1em;border:1px solid rgba(0,0,0,.12);border-radius:99px;padding:.7em 1em;color:#999;font-size:.85em;background:#fff}
.notif{position:absolute;top:2.6%;inset-inline:4%;z-index:6;display:flex;gap:.7em;align-items:center;background:rgba(251,249,245,.97);border-radius:1.1em;padding:.8em .9em;box-shadow:0 10px 30px rgba(0,0,0,.25);transform:translateY(-150%);opacity:0}
.notif i{font-style:normal;width:2.1em;height:2.1em;border-radius:50%;background:#3B4835;color:#fff;display:grid;place-items:center;font-weight:700;flex:none}

.chip.c1{top:16%;inset-inline-start:8%}.chip.c2{bottom:16%;inset-inline-end:8%}

/* BEFORE/AFTER */
.ba-grid{display:grid;grid-template-columns:1fr 1fr;gap:clamp(30px,5vw,80px);align-items:center}
.ba{position:relative;height:min(72vh,640px);aspect-ratio:3/4;max-width:100%;justify-self:center;border-radius:16px;overflow:hidden;--p:50%;box-shadow:0 30px 60px rgba(0,0,0,.18);user-select:none}
.ba img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none}
.ba .before{clip-path:inset(0 calc(100% - var(--p)) 0 0)}
.ba-line{position:absolute;top:0;bottom:0;left:var(--p);width:2px;margin-left:-1px;background:#fff;pointer-events:none}
.ba-line i{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:48px;height:48px;border-radius:50%;background:#fff;color:var(--olive);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.ba input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;margin:0}
.ba-l{position:absolute;top:16px;z-index:2;background:rgba(28,27,24,.62);color:#fff;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;pointer-events:none}
.ba-l.l{left:16px}.ba-l.r{right:16px;background:rgba(43,53,39,.85)}
.ba-hint{margin-top:2.4vh;font-weight:700;color:var(--olive-2);display:flex;gap:10px;align-items:center}

/* MOTION: word reveal */
.wr .w{display:inline-block;opacity:0;transform:translateY(.45em);transition:opacity .7s var(--ease),transform .7s var(--ease)}
.wr.in .w,.hero h1.in .w{opacity:1;transform:none}
/* image reveal */
.ph.rv,.fphoto.rv,.ba.rv{opacity:1;transform:none;clip-path:inset(10% 6% 10% 6% round 16px);transition:clip-path 1.2s var(--ease)}

.btn{will-change:transform}

.pkg .pr{font-size:clamp(30px,min(2.7vw,5.2vh),40px)!important;margin-top:1.8vh}

.stat .big{font-size:clamp(44px,min(5.2vw,9.6vh),86px)!important}

/* ================= DESIGN SYSTEM v6 — "Pulse of the business" ================= */
:root{
  --ivory:#ECEBE4; --stone:#E2E1D8; --card:#F5F4EF;
  --olive:#2B3527; --olive-2:#3B4835; --sage:#8FA287; --sage-l:#CFDCC4;
  --rose:#4F6A47; --rose-l:#CFDCC4;               /* accents are now fern / celadon — no terracotta */
  --ink:#1A1C17; --muted:#4C4F46; --line:rgba(26,28,23,.14);
  --r:6px;
}
body{background:var(--ivory)}
::selection{background:var(--sage-l);color:var(--olive)}
/* headlines: no accented phrase */
h1 em,h2 em,.flow .ft h3 em{font-style:normal!important;color:inherit!important}
h2{font-weight:500;letter-spacing:-.012em;line-height:1.04}
html[lang="ar"] h2{line-height:1.45}
/* labels: sentence case, no tracking */
.eyebrow{text-transform:none!important;letter-spacing:0!important;font-size:15px!important;font-weight:600;color:var(--rose)}
.dark .eyebrow,.hero .eyebrow{color:var(--sage-l)}
.flow .k,.rd .d,.wk .w,.ind .tag,.cmp th,.stat .pre{text-transform:none!important;letter-spacing:0!important}
.flow .k{font-size:min(1.3cqw,2.2cqh)}
.btn .ar{display:none}
.btn{border-radius:var(--r);letter-spacing:0}
.langs,.curs{border-radius:var(--r)}.langs button,.curs button{border-radius:4px}
.card{border-radius:var(--r);box-shadow:none}
/* strip without ornaments */
.strip span::before{content:none}
.strip .wrap{justify-content:flex-start;gap:6px 0}
.strip span{padding-inline:0 22px;margin-inline-end:22px;border-inline-end:1px solid rgba(244,241,235,.22)}
.strip span:last-child{border:none}

/* folio = real pagination */
.folio{position:absolute;top:calc(var(--navh) + 14px);inset-inline-end:var(--pad);font:600 13px "Manrope",sans-serif;font-variant-numeric:tabular-nums;color:var(--muted);opacity:.7}
.dark .folio,.flow-s .folio{color:var(--sage-l)}
@media(max-width:760px){.folio{display:none}}

/* PAINS — editorial statements, no cards */
.plist{display:grid;grid-template-columns:1fr 1fr;gap:clamp(22px,4.4vh,48px) clamp(30px,6vw,96px)}
.pl h3{font-size:clamp(24px,min(2.4vw,4.4vh),36px);font-weight:500;line-height:1.12;max-width:18ch}
.pl p{margin-top:10px;color:var(--muted);max-width:42ch;font-size:clamp(15px,min(1.15vw,2vh),17px)}
.pl{padding-inline-start:20px;border-inline-start:3px solid var(--sage-l)}
@media(max-width:760px){.plist{grid-template-columns:1fr;gap:16px}.pl h3{font-size:21px}.pl p{font-size:14px;margin-top:4px}.pl{padding-inline-start:14px}}
@media(max-width:760px) and (max-height:760px){.pl p{display:none}}

/* SERVICES — interactive index */
.sx{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:clamp(24px,5vw,80px);align-items:start}
.sx-list{list-style:none;counter-reset:none}
.sx-list button{all:unset;cursor:pointer;display:block;width:100%;padding:min(1.6vh,14px) 0;border-bottom:1px solid var(--line);font-family:var(--serif);font-size:clamp(24px,min(2.4vw,4.4vh),36px);font-weight:500;line-height:1.1;color:rgba(26,28,23,.38);transition:color .35s var(--ease),padding .35s var(--ease)}
.sx-list button:focus-visible{outline:2px solid var(--rose);outline-offset:4px}
.sx-list button[aria-selected="true"]{color:var(--ink);padding-inline-start:18px;box-shadow:inset 3px 0 0 var(--rose)}
html[dir="rtl"] .sx-list button[aria-selected="true"]{box-shadow:inset -3px 0 0 var(--rose)}
.sx-m{display:none}
.sx-panel{background:var(--olive);color:var(--ivory);border-radius:var(--r);padding:clamp(22px,3.6vh,44px);min-height:min(50vh,440px);transition:opacity .18s,transform .18s}

.sx-r{font-weight:700;color:var(--sage-l);font-size:16px}
.sx-proof{margin-top:12px;font-size:13.5px;color:rgba(236,235,228,.75)}
@media(max-width:760px){

  .sx-list button{font-size:20px;padding:11px 0}

/* INDUSTRIES — expanding gallery */
.acc{display:flex;gap:10px;height:min(60vh,520px)}
.ai{all:unset;cursor:pointer;position:relative;flex:1;min-width:0;border-radius:var(--r);overflow:hidden;transition:flex .7s var(--ease);color:#fff}
.ai.on{flex:3.2}
.ai img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s var(--ease),filter .6s}
.ai:not(.on) img{filter:brightness(.55) saturate(.8)}
.ai::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 40%,rgba(20,24,18,.85) 100%)}
.ai-t{position:absolute;z-index:2;inset-inline-start:18px;bottom:18px;font:600 15px var(--sans);transition:opacity .3s}
.ai:not(.on) .ai-t{writing-mode:vertical-rl;transform:rotate(180deg);bottom:18px;inset-inline-start:50%;margin-inline-start:-10px}
html[dir="rtl"] .ai:not(.on) .ai-t{transform:none}
.ai-b{position:absolute;z-index:2;inset-inline:22px;bottom:22px;display:flex;flex-direction:column;gap:6px;opacity:0;transform:translateY(10px);transition:opacity .4s .2s,transform .5s .2s var(--ease);max-width:44ch}
.ai.on .ai-t{opacity:0}
.ai.on .ai-b{opacity:1;transform:none}
.ai-b b{font-family:var(--serif);font-weight:500;font-size:clamp(24px,min(2.2vw,4vh),34px);line-height:1.1}
.ai-b span{font-size:15px;opacity:.9}
.ai:focus-visible{outline:2px solid var(--rose);outline-offset:3px}
@media(max-width:760px){
  .acc{flex-direction:column;height:62svh;gap:8px}
  .ai.on{flex:4}
  .ai:not(.on) .ai-t{writing-mode:horizontal-tb;transform:none;inset-inline-start:14px;margin:0;bottom:50%;translate:0 50%}
  .ai-b{inset-inline:14px;bottom:14px}.ai-b b{font-size:20px}.ai-b span{font-size:13px}
}
@media(max-width:760px) and (max-height:760px){.acc{height:58svh}.ai-b span{display:none}}

/* PACKAGES — columns, not identical cards */
.pkg:not(.hi){background:transparent;border:none;border-top:2px solid var(--olive);border-radius:0;padding-inline:4px}
.pkg.hi{border-radius:var(--r)}
.pkg .badge{background:var(--sage-l);color:var(--olive);border-radius:4px}
.pkg li::before{color:var(--rose)}
/* other surfaces */
.rd{border-top-color:rgba(236,235,228,.22)}
.cmp{border-radius:var(--r)}
.fphoto,.case-b .ph,.ba,.ind .ph{border-radius:var(--r)!important}
.ba-l.r{background:rgba(43,53,39,.9)}
.team span{border-radius:4px}
.chip{border-radius:8px}

/* MENU */
.burger{all:unset;cursor:pointer;width:44px;height:40px;display:grid;place-content:center;gap:6px;border:1px solid currentColor;border-radius:var(--r)}
.burger span:not(.sr){display:block;width:18px;height:1.5px;background:currentColor;transition:transform .35s var(--ease)}
.burger[aria-expanded="true"] span:nth-child(1){transform:translateY(3.75px) rotate(45deg)}
.burger[aria-expanded="true"] span:nth-child(2){transform:translateY(-3.75px) rotate(-45deg)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.menu{position:fixed;inset:0;z-index:88;background:var(--olive);color:var(--ivory);display:flex;flex-direction:column;justify-content:center;padding:calc(var(--navh) + 20px) var(--pad) 40px;clip-path:inset(0 0 100% 0);transition:clip-path .55s var(--ease)}
.menu.open{clip-path:inset(0 0 0 0)}
.menu nav{display:flex;flex-direction:column;gap:min(1.2vh,10px)}
.menu nav a{font-family:var(--serif);font-weight:500;font-size:clamp(30px,min(5vw,7vh),68px);line-height:1.05;text-decoration:none;opacity:0;transform:translateY(18px);transition:opacity .45s calc(.12s + var(--i)*.04s),transform .55s calc(.12s + var(--i)*.04s) var(--ease),color .2s}
.menu.open nav a{opacity:1;transform:none}
.menu nav a:hover,.menu nav a:focus-visible{color:var(--sage-l)}
.menu-foot{margin-top:5vh;display:flex;gap:24px;align-items:center;flex-wrap:wrap}.mlangs{display:none}.mlangs button[aria-pressed="true"]{background:var(--ivory)!important;color:var(--ink)!important}
@media(max-width:760px){.nav .langs{display:none}.mlangs{display:flex}}.menu-foot a{color:var(--sage-l);font-weight:600;text-decoration:none}
html.menu-open .nav{background:transparent!important;color:var(--ivory)!important;border-color:transparent!important}
html.menu-open .dots{opacity:0}
html.menu-open{overflow:hidden}
@media(max-width:760px){.langs button{padding:6px 8px}.burger{width:40px;height:36px}}

/* MOTION — one orchestrated entrance; quiet reveals elsewhere */
.rv{transform:none!important;transition:opacity .6s var(--ease)!important}
.ph.rv,.fphoto.rv,.ba.rv{transition:clip-path 1.2s var(--ease)!important}
.hero-text>*{animation:heroIn 1s var(--ease) both}
.hero-text>.eyebrow{animation-delay:.25s}.hero-text>.hero-sub{animation-delay:.9s}.hero-text>.hero-ctas{animation-delay:1.05s}
.hero-text>h1{animation:none}
@keyframes heroIn{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.hero-media{animation:mediaIn 1.4s .15s var(--ease) both}
@keyframes mediaIn{from{clip-path:inset(0 0 0 100%)}to{clip-path:inset(0 0 0 0)}}
html[dir="rtl"] .hero-media{animation-name:mediaInR}
@keyframes mediaInR{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.phone{animation:phoneIn 1.2s .8s var(--ease) both}
@keyframes phoneIn{from{opacity:0;transform:translateY(40px) rotate(-2deg)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.hero-text>*,.hero-media,.phone{animation:none!important}.menu,.menu nav a,.ai,.ai img,.sx-panel{transition:none!important}}

/* founder photo on phones: portrait crop, face + shoulders */

/* ===== v7 polish ===== */
.copy-brand{font-family:"Cormorant Garamond",serif;font-weight:600;letter-spacing:.14em;font-size:14px}
.copy-brand .amp{margin:0 .35em 0 .15em;color:var(--sage-l)}

@media(max-width:760px){

  /* packages: segmented tabs, one plan at a time */
  .pk-tabs{display:flex;gap:4px;margin-top:14px;border:1px solid var(--line);border-radius:var(--r);padding:3px;background:var(--card)}
  .pk-tabs button{all:unset;flex:1;text-align:center;cursor:pointer;font:700 13.5px var(--sans);padding:9px 4px;border-radius:4px;color:var(--muted)}
  .pk-tabs button[aria-pressed="true"]{background:var(--olive);color:var(--ivory)}
  #pkList{padding-top:6px!important;margin-top:10px}

  .cmp th,.cmp td{border:none!important;width:auto!important;padding:6px 6px!important;font-size:12.5px!important;text-align:center}

  .cmp th{font-size:11.5px!important;line-height:1.25;white-space:normal}

  /* keep content clear of Safari's floating toolbar */
  .screen{padding-bottom:max(22px,calc(env(safe-area-inset-bottom) + 18px))}
  .flow-s .stage{height:calc(100svh - var(--navh) - 56px)}
}

const Hero=(function(){
  const ph=document.getElementById("phone"); if(!ph) return null;
  const g=id=>document.getElementById(id);
  const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)), seg=(t,a,b)=>cl((t-a)/(b-a)), e=x=>1-Math.pow(1-cl(x),3);
  const D=16, msgs=[["m1",3.4],["ty1",4.2,5.4],["m2",5.4],["m3",7.2],["ty2",7.9,8.7],["m4",8.7]];
  let lang="en";
  let niche="spa", pinned=false;
  const L=v=>typeof v==="string"?v:(v[lang]||v.en);
  function data(){return Object.assign({},HERO_T[lang]||HERO_T.en,(HERO_S[niche][lang])||{})}
  function fill(){const d=data(),S=HERO_S[niche];document.querySelectorAll("[data-h]").forEach(el=>{const v=d[el.dataset.h]; if(v!==undefined) el.textContent=v});
    g("rPrice").textContent=L(S.price); g("nAmt").textContent=L(S.amt); const im=g("reelImg"); if(!im.src.endsWith(S.img)) im.src=S.img;
    const NL=NICHE_L[lang]||NICHE_L.en; g("nicheL").textContent=NL.l;
    g("nicheB").innerHTML=NICHE_ORDER.map((k,i)=>`<button data-n="${k}" aria-pressed="${k===niche}">${NL.n[i]}</button>`).join("");
    g("nicheB").querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{setNiche(b.dataset.n,true)}));}
  function setNiche(n,user){niche=n; if(user)pinned=true; fill(); t0=0; if(!run){draw(0)}}
  function setLang(l){lang=l; fill();}
  function draw(T){
    const t=T%D, d=HERO_T[lang]||HERO_T.en;
    g("reelImg").style.transform=`scale(${1.04+.06*cl(t/3)})`;
    // tap
    const tp=seg(t,2.1,2.8); const tap=g("tap"); tap.style.opacity=t>2.1&&t<2.9?(1-tp)*.9:0; tap.style.transform=`scale(${.6+tp*1.4})`;
    g("rCta").style.transform=t>2.2&&t<2.6?"scale(.96)":"none";
    // chat slide in / out
    const cin=e(seg(t,2.6,3.1)), cout=e(seg(t,14.6,15.4));
    g("chat").style.transform=`translateY(${(1-cin+cout)*100}%)`;
    // messages
    msgs.forEach(([id,a,b])=>{const el=g(id); const on=t>=a&&(b===undefined||t<b)&&t<15.4; el.style.display=on?"block":"none";
      const p=e(seg(t,a,a+.35)); el.style.opacity=p; el.style.transform=`translateY(${(1-p)*10}px) scale(${.96+.04*p})`;});
    g("cStat").textContent=(t>4.2&&t<5.4)||(t>7.9&&t<8.7)?d.typing:d.online;
    // notification
    const ni=e(seg(t,9.6,10.1)), no=e(seg(t,13.2,13.7)); const n=g("notif");
    n.style.opacity=ni*(1-no); n.style.transform=`translateY(${(-150+150*ni)-(150*no)}%)`;
    // chips
    const c1=e(seg(t,5.6,6.1))*(1-e(seg(t,14.6,15.2))); g("chip1").style.opacity=c1; g("chip1").style.transform=`translateY(${(1-c1)*12}px)`;
    const c2=e(seg(t,10.2,10.7))*(1-e(seg(t,14.6,15.2))); g("chip2").style.opacity=c2; g("chip2").style.transform=`translateY(${(1-c2)*12}px)`;
    g("chipN").textContent=t>10.9?18:17;
  }
  let raf=0,t0=0,run=false;
  const loop=ts=>{if(!t0)t0=ts; const el=(ts-t0)/1000; if(el>=D){const i=NICHE_ORDER.indexOf(niche); niche=NICHE_ORDER[(i+1)%NICHE_ORDER.length]; pinned=false; fill(); t0=ts;} draw(Math.min(el,D-0.001)); raf=requestAnimationFrame(loop)};
  return {setLang,setNiche,draw,play(){if(run)return;run=true;t0=0;raf=requestAnimationFrame(loop)},stop(){run=false;cancelAnimationFrame(raf)}};
})();

function setLang(l){
  if(!T[l]) l="en"; lang=l; const d=T[l];
  document.documentElement.lang=l; document.documentElement.dir=l==="ar"?"rtl":"ltr";
  $$("[data-i]").forEach(e=>{const v=d[e.dataset.i]; if(v!==undefined) e.textContent=v});
  $$("[data-ih]").forEach(e=>{const v=d[e.dataset.ih]; if(v!==undefined) e.innerHTML=v});
  $$(".langs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===l));
  render(); calc(); observe(); if(Flow){Flow.setLang(l); Flow.draw(0);} if(Hero){Hero.setLang(l);} if(!curChosen && typeof setCur==="function" && window.__curReady){setCur(l==="tk"?"TMT":"AED");} if(typeof motion==="function")motion(); const u=document.getElementById("n4u"); if(u)u.textContent=curLab();
  try{localStorage.setItem("lang",l)}catch(e){}
  if(["","#en","#ru","#ar","#tk"].includes(location.hash)) history.replaceState(null,"","#"+l);
}

// reveal on view (native scroll — no hijacking)
let io=null;
function observe(){
  if(!("IntersectionObserver" in window)){document.documentElement.classList.add("no-io");return}
  if(io) io.disconnect();
  io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target);
    e.target.querySelectorAll("[data-count]").forEach(countUp)}}),{threshold:.12,rootMargin:"0px 0px -5% 0px"});
  $$(".rv:not(.in)").forEach(el=>io.observe(el));
}
function countUp(c){const to=+c.dataset.count,t0=performance.now(),dur=1300;
  const st=t=>{const p=Math.min(1,(t-t0)/dur);c.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)}

// ROI calculator

  $("#o1").textContent=a; $("#o2").textContent=b+"%"; $("#o3").textContent=fmt(conv(c,false))+" "+curLab();
  $("[data-i=c3]").textContent=T[lang].c3+", "+curLab(); $("[data-i=c_rev]").textContent=T[lang].c_rev+", "+curLab();
  const book=a*30*b/100; $("#rb").textContent=fmt(book); $("#rr").textContent=fmt(conv(book*c,false));}

window.FLOWFILL=v=>{const c=CUR[cur]; const cpc=6*c.r; const n=(cpc<10&&Math.abs(cpc-Math.round(cpc))>.05)?cpc.toFixed(1).replace(".",(lang==="ru"||lang==="tk")?",":"."):Math.round(cpc);
  return v.replace("{cpc}",n+" "+curLab()).replace("{chk}",fmt(600*c.r)+" "+curLab());};

window.__curReady=true; setCur(!curChosen&&lang==="tk"?"TMT":cur);

// ===== motion: word split, stagger, magnetic, before/after =====
function splitW(el){if(el.dataset.split===el.innerHTML)return;const walk=n=>{[...n.childNodes].forEach(c=>{if(c.nodeType===3){const f=document.createDocumentFragment();
  c.textContent.split(/(\s+)/).forEach(p=>{if(!p)return;if(/^\s+$/.test(p))f.appendChild(document.createTextNode(p));else{const s=document.createElement("span");s.className="w";s.textContent=p;f.appendChild(s)}});c.replaceWith(f)}else if(c.nodeType===1&&!c.classList.contains("w"))walk(c)})};
  walk(el);[...el.querySelectorAll(".w")].forEach((w,i)=>w.style.transitionDelay=(i*45)+"ms");el.classList.add("wr");el.dataset.split=el.innerHTML;}
function motion(){
  const h1=$(".hero h1"); if(h1){h1.classList.remove("in");splitW(h1);requestAnimationFrame(()=>requestAnimationFrame(()=>h1.classList.add("in")));}
  
}
if(matchMedia("(hover:hover) and (pointer:fine)").matches){
  document.addEventListener("pointermove",e=>{const b=e.target.closest&&e.target.closest(".btn.light,.btn.dark");$$(".btn.mag").forEach(x=>{if(x!==b){x.style.transform="";x.classList.remove("mag")}});
    if(!b)return;const r=b.getBoundingClientRect();const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);b.classList.add("mag");b.style.transform=`translate(${dx*.18}px,${dy*.28}px)`;});
}
(function(){const box=$("#baBox"),rg=$("#baRange");if(!box)return;const set=v=>box.style.setProperty("--p",v+"%");
  rg.addEventListener("input",()=>{demo=false;set(rg.value)});let demo=true;
  new IntersectionObserver((es,o)=>es.forEach(e=>{if(!e.isIntersecting)return;o.disconnect();const t0=performance.now();
    const st=t=>{if(!demo)return;const k=(t-t0)/1000;let v;if(k<1)v=50-30*Math.sin(k*Math.PI/2);else if(k<2.4)v=20+65*((1-Math.cos((k-1)/1.4*Math.PI))/2);else if(k<3.2)v=85-35*((1-Math.cos((k-2.4)/.8*Math.PI))/2);else{set(50);rg.value=50;return}
      set(v);rg.value=v;requestAnimationFrame(st)};setTimeout(()=>requestAnimationFrame(st),700)}),{threshold:.5}).observe(box);})();

const nav=$("#nav");
(function(){const bg=$("#burger"),mn=$("#menu");$("#menuWa").href="https://wa.me/"+CONFIG.whatsapp;$("#menuWa").textContent="WhatsApp "+CONFIG.whatsappLabel;

$$('a[href^="#"]').forEach(a=>a.addEventListener("click",e=>{const id=a.getAttribute("href");if(id.length<2)return;const t=document.querySelector(id);if(!t)return;e.preventDefault();t.scrollIntoView({behavior:"smooth"})}));
